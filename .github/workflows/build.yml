name: Build

on:
  push:
    branches:
      - master
      - baselib-api-migration-steps-1-3
      - seabourne-starter-vertical-slice
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build mod
        run: >-
          dotnet build SEABOURNE.csproj
          --configuration Release
          -p:Sts2DataDir="$GITHUB_WORKSPACE"
          -p:ModsPath="$RUNNER_TEMP/mods/"
