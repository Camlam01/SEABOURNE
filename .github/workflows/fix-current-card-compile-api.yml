name: Temporary current card compile migration

on:
  push:
    branches:
      - baselib-api-migration-steps-1-3

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix concrete card declarations and obsolete overrides
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('SEABOURNECode/Cards')
          changed = []
          constructor_fixes = 0
          discard_overrides_removed = 0
          duplicate_usings_removed = 0

          for path in root.rglob('*.cs'):
              if path.name == 'SeabourneCard.cs':
                  continue

              original = path.read_text(encoding='utf-8-sig')
              text = original

              # Current C# primary-constructor syntax requires an empty parameter
              # list on the concrete derived type when arguments are passed to the
              # primary-constructor base type.
              text, n = re.subn(
                  r'(public\s+(?:sealed\s+)?class\s+\w+)\s*:\s*SeabourneCard\(',
                  r'\1() : SeabourneCard(',
                  text,
                  count=1,
              )
              constructor_fixes += n

              # This was a stub-era hook and no longer exists on CardModel.
              text, n = re.subn(
                  r'(?m)^\s*public\s+override\s+bool\s+ShouldMoveToDiscard\(\)\s*=>\s*false;\s*\n?',
                  '',
                  text,
              )
              discard_overrides_removed += n

              # Remove repeated using directives left by the original scaffolding.
              lines = text.splitlines()
              seen_usings = set()
              cleaned = []
              for line in lines:
                  stripped = line.strip()
                  if stripped.startswith('using ') and stripped.endswith(';'):
                      if stripped in seen_usings:
                          duplicate_usings_removed += 1
                          continue
                      seen_usings.add(stripped)
                  cleaned.append(line)
              text = '\n'.join(cleaned) + ('\n' if original.endswith('\n') else '')

              if ': SeabourneCard(' in text and not re.search(r'class\s+\w+\(\)\s*:\s*SeabourneCard\(', text):
                  raise SystemExit(f'Unmigrated concrete constructor syntax: {path}')
              if 'ShouldMoveToDiscard()' in text:
                  raise SystemExit(f'Obsolete ShouldMoveToDiscard remains: {path}')

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(path.as_posix())

          workflow = Path('.github/workflows/fix-current-card-compile-api.yml')
          if workflow.exists():
              workflow.unlink()

          print(f'Card files changed: {len(changed)}')
          print(f'Concrete constructor declarations fixed: {constructor_fixes}')
          print(f'Obsolete discard overrides removed: {discard_overrides_removed}')
          print(f'Duplicate using directives removed: {duplicate_usings_removed}')

          if constructor_fixes != 88:
              raise SystemExit(f'Expected 88 concrete card constructor fixes, got {constructor_fixes}')

          for path in changed:
              print(path)
          PY

          git diff --check

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix concrete card syntax for current BaseLib API"
          git push origin HEAD:${GITHUB_REF_NAME}
